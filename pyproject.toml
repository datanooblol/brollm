[project]
name = "brollm"
version = "0.2.0"
description = "When you think about light weight LLMs, call brollm!"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "boto3>=1.39.17",
    "httpx>=0.28.1",
    "requests>=2.32.4",
    "ipykernel>=6.30.0",
    "pytest>=8.0.0",
    "ruff>=0.16.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["brollm*"]
